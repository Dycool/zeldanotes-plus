<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 88">
  <defs>
    <linearGradient id="triforce-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#a67c1e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ffd700" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <!-- Top Triangle -->
    <polygon points="50,2 74,43 26,43" fill="url(#triforce-gold)" />
    <!-- Bottom Left Triangle -->
    <polygon points="24,46 48,87 0,87" fill="url(#triforce-gold)" />
    <!-- Bottom Right Triangle -->
    <polygon points="76,46 100,87 52,87" fill="url(#triforce-gold)" />
  </g>
</svg>
